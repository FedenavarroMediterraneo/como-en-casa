<body>
<style>
/* Layout: iOS — título grande, frase del día, dos widgets (comida/cena), aviso, semana horizontal, luz con selector Hoy/Mañana */
:root{
  --bg:#f2f2f7; --card:#ffffff; --fill:rgba(120,120,128,.12); --label:#000000; --label-2:rgba(60,60,67,.6); --label-3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.14);
  --green:#34c759; --orange:#ff9500; --red:#ff3b30; --blue:#007aff;
  --t-man:#f08c00; --t-par:#0a6cf0; --t-med:#e5484d; --t-tar:#2fa84f; --t-lib:#e8457f; --t-vac:#48484a; --t-otro:#48484a; --t-baja:#8e8e93;
  --green-bg:rgba(52,199,89,.13); --orange-bg:rgba(255,149,0,.14); --red-bg:rgba(255,59,48,.12); --blue-bg:rgba(0,122,255,.11);
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --round:"SF Pro Rounded", ui-rounded, -apple-system, system-ui, sans-serif;
  --serif:"New York", ui-serif, Georgia, serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1c1c1e; --fill:rgba(120,120,128,.24); --label:#ffffff; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --blue:#0a84ff;
  --green-bg:rgba(48,209,88,.17); --orange-bg:rgba(255,159,10,.17); --red-bg:rgba(255,69,58,.17); --blue-bg:rgba(10,132,255,.2);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --fill:rgba(120,120,128,.24); --label:#ffffff; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --blue:#0a84ff;
  --green-bg:rgba(48,209,88,.17); --orange-bg:rgba(255,159,10,.17); --red-bg:rgba(255,69,58,.17); --blue-bg:rgba(10,132,255,.2);
  color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 40px;display:grid;gap:28px}

header{display:flex;justify-content:space-between;align-items:end;gap:12px}
.date{font-size:13px;font-weight:600;color:var(--label-2);text-transform:uppercase;letter-spacing:.02em}
h1{margin:2px 0 0;font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.clock{font-family:var(--round);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--label-2)}

.section{display:grid;gap:8px}
.section-title{font-size:13px;font-weight:600;text-transform:uppercase;color:var(--label-2);padding-left:16px;letter-spacing:.02em}
.card{background:var(--card);border-radius:22px}

.quote{padding:20px 22px;display:grid;gap:8px}
.quote p{margin:0;font-family:var(--serif);font-size:21px;line-height:1.35;font-weight:500;text-wrap:balance}
.quote span{font-size:13px;color:var(--label-2)}

/* Widgets comida / cena */
.meals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.meal{padding:16px 18px 6px;display:grid;gap:14px;align-content:start;background:linear-gradient(180deg,var(--tint) 0%,var(--card) 62%)}
.meal.casa{--tint:var(--green-bg);--c:var(--green)} .meal.tarde{--tint:var(--orange-bg);--c:var(--orange)} .meal.fuera{--tint:var(--red-bg);--c:var(--red)} .meal.nd{--tint:var(--fill);--c:var(--label-3)}
.meal-head{display:flex;align-items:center;gap:10px}
.tile{font-size:22px;line-height:1}
.status{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--c);box-shadow:0 0 0 6px var(--tint)}
.meal-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;font-size:13px;color:var(--label-2);margin-top:-16px}
.meal-legend span{display:inline-flex;align-items:center;gap:6px}
.meal-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.meal-head span{font-size:15px;font-weight:600;color:var(--c);text-transform:uppercase;letter-spacing:.02em}
.meal-head em{margin-left:auto;font-style:normal;font-size:13px;color:var(--label-2);font-variant-numeric:tabular-nums}
.meal h3{margin:0;font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1.12;text-wrap:balance}
.meal h3 small{display:block;font-size:15px;font-weight:400;color:var(--label-2);letter-spacing:-.01em;margin-top:4px}
.facts{list-style:none;margin:0;padding:0}
.facts li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--sep);font-size:15px}
.facts .ico{width:24px;text-align:center;font-size:17px}
.facts .k{color:var(--label-2)}
.facts .v{margin-left:auto;font-weight:600;text-align:right}
.v.ok{color:var(--green)} .v.warn{color:var(--orange)} .v.no{color:var(--red)} .v.na{color:var(--label-3);font-weight:500}

.notice{display:flex;gap:14px;align-items:center;padding:14px 18px}
.notice-ico{width:40px;height:40px;border-radius:11px;background:var(--orange-bg);display:grid;place-items:center;font-size:22px;flex:none}
.notice b{display:block;font-size:15px;font-weight:600}
.notice span{font-size:15px;color:var(--label-2);line-height:1.3}

/* Semana horizontal */
.week{padding:14px 10px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.col{display:grid;justify-items:center;gap:6px;padding:8px 2px;border-radius:16px;text-align:center}
.col.today{background:var(--fill)}
.col .dn{font-size:13px;font-weight:600;color:var(--label-2);text-transform:uppercase}
.col.today .dn{color:var(--blue)}
.col.dom .dd{color:var(--red)}
.col .dd{font-family:var(--round);font-size:22px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.col .tn{font-size:11px;font-weight:700;color:#fff;background:var(--tc,var(--t-baja));padding:3px 7px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;box-sizing:border-box;margin-bottom:2px;letter-spacing:0}
.week-head{display:flex;align-items:center;gap:8px;padding:0 4px 0 16px}
.week-head .section-title{padding-left:0}
.week-head .range{font-size:13px;color:var(--label-2);margin-left:auto;font-variant-numeric:tabular-nums}
.nav{display:flex;gap:6px}
.nav button{all:unset;cursor:pointer;width:32px;height:32px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--blue);font-size:18px;font-weight:600;line-height:1}
.nav button:disabled{opacity:.35;cursor:default}
.nav button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.nav .hoy-btn{width:auto;padding:0 12px;border-radius:16px;font-size:13px}
.bub{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.bub.casa{background:var(--green-bg)} .bub.tarde{background:var(--orange-bg)} .bub.fuera{background:var(--red-bg)} .bub.nd{background:var(--fill);opacity:.6}
.bub.chef{background:var(--blue-bg)} .bub.none{background:transparent}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--label-2);padding:0 16px}
@media (max-width:420px){.week{padding:12px 4px;gap:2px}.bub{width:32px;height:32px;font-size:16px}.col .dd{font-size:19px}}

/* Luz */
.luz{padding:16px 18px 18px;display:grid;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{all:unset;cursor:pointer;text-align:center;font-size:14px;font-weight:600;padding:7px 0;border-radius:8px;color:var(--label)}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.readout{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;min-height:58px}
.readout .h{font-size:13px;font-weight:600;color:var(--label-2)}
.price{font-family:var(--round);font-size:40px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.price small{font-size:15px;font-weight:500;color:var(--label-2);margin-left:4px}
.chip{font-size:13px;font-weight:600;padding:5px 11px;border-radius:99px}
.chip.barata{background:var(--green-bg);color:var(--green)} .chip.media{background:var(--orange-bg);color:var(--orange)} .chip.cara{background:var(--red-bg);color:var(--red)}
.chart{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));align-items:end;gap:3px;height:110px;touch-action:none;cursor:crosshair}
.chart i{display:block;border-radius:3px;opacity:.45;transition:opacity .12s}
.chart i.barata{background:var(--green)} .chart i.media{background:var(--orange)} .chart i.cara{background:var(--red)}
.chart i.sel{opacity:1}
.axis{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px;font-size:11px;color:var(--label-2);margin-top:-8px;font-variant-numeric:tabular-nums}
.axis span{white-space:nowrap}
.empty{padding:28px 8px;text-align:center;color:var(--label-2);font-size:15px;line-height:1.4}
.tips{list-style:none;margin:0;padding:0}
.tips li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--sep);font-size:15px}
.tips .ico{width:24px;text-align:center;font-size:17px}
.tips .v{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.tips .v small{font-weight:400;color:var(--label-2);margin-left:6px}

footer{font-size:12px;color:var(--label-2);text-align:center;line-height:1.6}
.ej{color:var(--orange)}
@media (prefers-reduced-motion:reduce){.chart i{transition:none}}
</style>

<div class="wrap">
  <header>
    <div><div class="date" id="fecha"></div><h1 id="titulo">Hoy</h1></div>

<script>
/* ====================== TURNOS ======================
   comida / cena: "casa" | "tarde" | "fuera"
   cocina: true | false | "laborable" (solo lun–vie) | null (no se muestra)
   ⚠️ Cambiar las claves por los códigos reales de Turnos */
const TURNOS = {
  "Mañana":               { nombre:"Mañana",            color:"var(--t-man)",  corto:"Mañana",   comida:"tarde", cena:"casa",  cocina:false },
  "Jornada partida":      { nombre:"Jornada partida",   color:"var(--t-par)",  corto:"Partida",  comida:"casa",  cena:"casa",  cocina:false },
  "Mediodía":             { nombre:"Mediodía",          color:"var(--t-med)",  corto:"Mediodía", comida:"fuera", cena:"casa",  cocina:false },
  "Tarde":                { nombre:"Tarde",             color:"var(--t-tar)",  corto:"Tarde",    comida:"casa",  cena:"fuera", cocina:true  },
  "Libranza":             { nombre:"Libranza",          color:"var(--t-lib)",  corto:"Libre",    comida:"casa",  cena:"casa",  cocina:"laborable" },
  "Vacaciones":           { nombre:"Vacaciones",        color:"var(--t-vac)",  corto:"Vacas",    comida:"casa",  cena:"casa",  cocina:null },
  "Días acumulados":      { nombre:"Días acumulados",   color:"var(--t-otro)", corto:"Acum.",    comida:"casa",  cena:"casa",  cocina:null },
  "Asuntos propios":      { nombre:"Asuntos propios",   color:"var(--t-otro)", corto:"A. prop.", comida:"casa",  cena:"casa",  cocina:null },
  "Días por horas extra": { nombre:"Día por horas extra", color:"var(--t-otro)", corto:"H. extra", comida:"casa", cena:"casa",  cocina:null },
  "Baja laboral":         { nombre:"Baja",              color:"var(--t-baja)", corto:"Baja",     comida:"casa",  cena:"casa",  cocina:null },
};
// Día sin nada en el cuadrante
const SIN_TURNO = { nombre:"Sin turno", color:"var(--t-baja)", corto:"—", comida:"nd", cena:"nd", cocina:null };
const turnoDe = (turnos,d) => TURNOS[turnos[iso(d)]] ?? SIN_TURNO;
const CAMBIO_DE_DIA = 22; // desde las 22:00 se muestra el día siguiente

/* ====================== FIRESTORE ======================
   Turnos (Web) guarda todo en turnos/data → events: [{date:"AAAA-MM-DD", person, type, order}] */
const FIRESTORE = "https://firestore.googleapis.com/v1/projects/turnos-web-mediterraneo/databases/(default)/documents/turnos/data?key=AIzaSyDHC981ppY60vOx5fimVAk-0L8XzTnUun8&mask.fieldPaths=events";
const PERSONA = "Fede";
let turnosEjemplo = false, cacheTurnos = null, cacheHora = 0;
async function cargarTodos(){
  if(cacheTurnos && Date.now()-cacheHora < 10*60*1000) return cacheTurnos;
  try{
    const r = await fetch(FIRESTORE); if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    const out = {}, orden = {};
    for(const v of j.fields?.events?.arrayValue?.values ?? []){
      const f = v.mapValue?.fields; if(!f || f.person?.stringValue !== PERSONA) continue;
      const fecha = f.date?.stringValue, tipo = f.type?.stringValue;
      const o = Number(f.order?.integerValue ?? f.order?.doubleValue ?? 0);
      if(fecha && tipo && (orden[fecha] === undefined || o < orden[fecha])){ out[fecha] = tipo; orden[fecha] = o; }
    }
    turnosEjemplo = false; cacheTurnos = out; cacheHora = Date.now();
    return out;
  }catch(e){
    // Sin conexión con Firestore (p. ej. en la vista previa): datos de ejemplo
    turnosEjemplo = true;
    const patron = ["Tarde","Tarde","Mediodía","Mañana","Jornada partida","Libranza","Libranza"], out = {};
    const hoy = new Date(); for(let i=-35;i<70;i++){ const d=addDays(hoy,i); out[iso(d)] = patron[(d.getDay()+6)%7]; }
    return out;
  }
}
async function cargarTurnos(){ return cargarTodos(); }

/* ====================== LUZ (Red Eléctrica · PVPC) ======================
   Devuelve 24 precios en €/kWh, o null si aún no están publicados (mañana: hacia las 20:15). */
let luzEjemplo = false;
const EJEMPLO_HOY = [.112,.104,.098,.095,.094,.099,.118,.142,.151,.128,.096,.081,.074,.071,.073,.082,.104,.139,.176,.198,.204,.187,.158,.131];
const EJEMPLO_MAN = [.118,.109,.101,.097,.096,.102,.124,.149,.146,.117,.088,.072,.066,.063,.068,.079,.101,.133,.169,.191,.196,.181,.152,.127];
async function cargarLuz(dia, ejemplo){
  try{
    const f = iso(dia);
    const r = await fetch(`https://apidatos.ree.es/es/datos/mercados/precios-mercados-tiempo-real?start_date=${f}T00:00&end_date=${f}T23:59&time_trunc=hour`);
    if(!r.ok) return null;
    const j = await r.json();
    const s = j.included?.find(x => /PVPC/i.test(x.type) || x.id === "1001");
    if(!s) return null;
    const p = Array(24).fill(null);
    s.attributes.values.forEach(v => { p[new Date(v.datetime).getHours()] = v.value/1000; });
    return p.some(v=>v==null) ? null : p;
  }catch(e){ luzEjemplo = true; return ejemplo; } // sin red (artifact): ejemplo
}

/* ====================== UTILIDADES ====================== */
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
const laborable = d => d.getDay()>=1 && d.getDay()<=5;
const cocinaDe = (t,d) => t.cocina==="laborable" ? (laborable(d)?true:null) : t.cocina;
const DIAS=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const fmtFecha=new Intl.DateTimeFormat("es-ES",{weekday:"long",day:"numeric",month:"long"});
const eur = v => v.toFixed(3).replace(".",",");
const diasDesdeInicio = d => Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - new Date(2026,9,27))/864e5);
const EMO = { casa:"🏠", tarde:"🕒", fuera:"🍱", nd:"❔" };
const hh = h => `${String(h).padStart(2,"0")}:00`;

/* ====================== WIDGETS COMIDA / CENA ====================== */
function widget(tipo,t,d){
  const estado=t[tipo], cocina=tipo==="comida"?cocinaDe(t,d):undefined;
  const titulo = {
    comida:{casa:"Como en casa", tarde:"Como en casa, pero tarde", fuera:"Como en el trabajo", nd:"Todavía no lo sé"},
    cena:{casa:"Ceno en casa", tarde:"Ceno en casa, pero tarde", fuera:"No ceno en casa", nd:"Todavía no lo sé"},
  }[tipo][estado];
  const sub = estado==="nd" ? "Este día aún no está en el cuadrante"
            : estado==="fuera" ? `Me llevo la ${tipo} en tupper`
            : estado==="tarde" ? `Llegaré cuando ya estéis ${tipo==="comida"?"comiendo":"cenando"}`
            : cocina===true ? "Puedo hacer la comida" : cocina===false ? "No puedo hacer la comida" : "Contad conmigo en la mesa";
  const filas = [];
  if(estado!=="nd" && tipo==="comida") filas.push(["👨‍🍳","Hacer la comida",
    estado==="fuera"?"No": cocina===true?"Puedo": cocina===false?"No puedo":"Sin definir",
    estado==="fuera"||cocina===false?"no": cocina===true?"ok":"na"]);
  if(estado!=="nd") filas.push(["🍱","Tupper", estado==="fuera"?"Sí, me lo llevo":"No hace falta", estado==="fuera"?"warn":"na"]);

  return `<div class="card meal ${estado}">
    <div class="meal-head"><div class="tile">${tipo==="comida"?"☀️":"🌘"}</div><span>${tipo==="comida"?"Comida":"Cena"}</span><i class="status" aria-label="${estado==="casa"?"Estoy":estado==="tarde"?"Llego tarde":estado==="nd"?"Sin turno":"No estoy"}"></i></div>
    <h3>${titulo}<small>${sub}</small></h3>
    <ul class="facts">${filas.map(([i,k,v,c])=>`<li><span class="ico">${i}</span><span class="k">${k}</span><span class="v ${c}">${v}</span></li>`).join("")}</ul>
  </div>`;
}

/* ====================== RENDER ====================== */
async function render(){
  const ahora=new Date(), hoy=new Date(ahora.getFullYear(),ahora.getMonth(),ahora.getDate());
  const turnos=await cargarTurnos(hoy,9);
  const verManana=ahora.getHours()>=CAMBIO_DE_DIA;
  const foco=verManana?addDays(hoy,1):hoy, tf=turnoDe(turnos,foco);

  document.getElementById("titulo").textContent=verManana?"Mañana":"Hoy";
  document.getElementById("fecha").textContent=fmtFecha.format(foco);
  const L=FRASES.length, fr=FRASES[((diasDesdeInicio(foco)%L)+L)%L];
  document.getElementById("frase").textContent=`“${fr.t}”`;
  document.getElementById("autor").textContent=`— ${fr.a}`;
  document.getElementById("meals").innerHTML=widget("comida",tf,foco)+widget("cena",tf,foco);

  const sig=addDays(foco,1), ts=turnoDe(turnos,sig);
  const que=[ts.comida==="fuera"&&"la comida", ts.cena==="fuera"&&"la cena"].filter(Boolean);
  const av=document.getElementById("avisos");
  if(que.length){
    av.innerHTML=`<div class="card notice"><div class="notice-ico">🍱</div><div>
      <b>${verManana?"Pasado mañana":"Mañana"} me llevo tupper</b>
      <span>Necesito ${que.join(" y ")} preparada. Si cocinamos ${verManana?"mañana":"hoy"}, mejor hacer de más.</span></div></div>`;
    av.hidden=false;
  } else av.hidden=true;

  await renderSemana();

  LUZ.hoy = await cargarLuz(hoy, EJEMPLO_HOY);
  LUZ.man = await cargarLuz(addDays(hoy,1), EJEMPLO_MAN);
  renderLuz();

  document.getElementById("foot").innerHTML=
    `Turnos: ${turnosEjemplo?'<span class="ej">ejemplo</span>':"Turnos — Mediterráneo"} · Luz: ${luzEjemplo?'<span class="ej">ejemplo</span>':"Red Eléctrica"} · `+
    ahora.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
}

/* ====================== SEMANA ====================== */
let semOffset=0; const SEM_MIN=-4, SEM_MAX=8;
const fmtCorto=new Intl.DateTimeFormat("es-ES",{day:"numeric",month:"short"});
async function renderSemana(){
  const a=new Date(), hoy=new Date(a.getFullYear(),a.getMonth(),a.getDate());
  const lunes=addDays(hoy,-((hoy.getDay()+6)%7)); // semana de lunes a domingo
  const ini=addDays(lunes,semOffset*7), turnos=await cargarTurnos(ini,7);
  let html="";
  for(let i=0;i<7;i++){
    const d=addDays(ini,i), t=turnoDe(turnos,d), c=cocinaDe(t,d), esHoy=iso(d)===iso(hoy);
    html+=`<div class="col${esHoy?" today":""}${d.getDay()===0?" dom":""}" title="${t.nombre}">
      <span class="dn">${esHoy?"Hoy":DIAS[d.getDay()]}</span>
      <span class="dd">${d.getDate()}</span>
      <span class="tn" style="--tc:${t.color}">${t.corto}</span>
      <span class="bub ${t.comida}" aria-label="Comida">${EMO[t.comida]}</span>
      <span class="bub ${t.cena}" aria-label="Cena">${EMO[t.cena]}</span>
      <span class="bub ${c===true?"chef":"none"}">${c===true?"👨‍🍳":""}</span>
    </div>`;
  }
  document.getElementById("semana").innerHTML=html;
  const tit = semOffset===0?"Esta semana": semOffset===1?"Próxima semana": semOffset===-1?"Semana pasada":
              semOffset>1?`Dentro de ${semOffset} semanas`:`Hace ${-semOffset} semanas`;
  document.getElementById("sem-tit").textContent=tit;
  document.getElementById("sem-rango").textContent=`${fmtCorto.format(ini)} – ${fmtCorto.format(addDays(ini,6))}`;
  document.getElementById("sem-hoy").hidden=semOffset===0;
  document.getElementById("sem-prev").disabled=semOffset<=SEM_MIN;
  document.getElementById("sem-next").disabled=semOffset>=SEM_MAX;
}
document.getElementById("sem-prev").addEventListener("click",()=>{semOffset--;renderSemana();});
document.getElementById("sem-next").addEventListener("click",()=>{semOffset++;renderSemana();});
document.getElementById("sem-hoy").addEventListener("click",()=>{semOffset=0;renderSemana();});

/* ====================== LUZ ====================== */
const LUZ = { hoy:null, man:null, vista:"hoy" };
const NIVEL_TXT={barata:"Barata",media:"Normal",cara:"Cara"};

// Franja más barata de n horas que empieza entre desde y hasta
function mejorFranja(p,n,desde,hasta){
  let best=null;
  for(let i=desde;i<=Math.min(hasta,24-n);i++){
    let s=0; for(let k=0;k<n;k++) s+=p[i+k];
    if(best===null||s<best.s) best={i,s};
  }
  return best ? {i:best.i, media:best.s/n} : null;
}

function renderLuz(){
  const esHoy=LUZ.vista==="hoy", p=esHoy?LUZ.hoy:LUZ.man, body=document.getElementById("luz-body");
  document.getElementById("b-hoy").setAttribute("aria-pressed",esHoy);
  document.getElementById("b-man").setAttribute("aria-pressed",!esHoy);
  if(!p){
    body.innerHTML=`<div class="empty">Los precios de mañana se publican cada día hacia las 20:15.<br>Vuelve a mirar esta noche.</div>`;
    return;
  }
  const o=[...p].sort((a,b)=>a-b), nivel=v=>v<=o[8]?"barata":v<=o[16]?"media":"cara";
  const max=Math.max(...p), min=Math.min(...p);
  const hAhora=new Date().getHours(), desde=esHoy?hAhora:0;
  const inicial=esHoy?hAhora:p.indexOf(min);

  const lav=mejorFranja(p,2,desde,22);      // lavadora / lavavajillas
  const sec=mejorFranja(p,2,Math.max(desde,8),22); // secadora (horas de estar en casa)
  const hor=mejorFranja(p,1,Math.max(desde,12),21); // horno

  const tip=(ico,k,f,n)=> f ? `<li><span class="ico">${ico}</span><span>${k}</span><span class="v">${hh(f.i)}–${hh(f.i+n)}<small>${eur(f.media)} €</small></span></li>`
                            : `<li><span class="ico">${ico}</span><span>${k}</span><span class="v" style="color:var(--label-3)">Ya no quedan franjas</span></li>`;

  body.innerHTML=`
    <div class="readout">
      <div><div class="h" id="r-h"></div><div class="price" id="r-p"></div></div>
      <span class="chip" id="r-c"></span>
    </div>
    <div class="chart" id="chart" aria-label="Precio por horas">${p.map((v,i)=>
      `<i class="${nivel(v)}" style="height:${Math.max(6,v/max*100)}%"></i>`).join("")}</div>
    <div class="axis">${p.map((_,i)=>`<span>${i%6===0?i+"h":""}</span>`).join("")}</div>
    <ul class="tips">
      ${tip("🧺","Lavadora · lavavajillas",lav,2)}
      ${tip("🌀","Secadora",sec,2)}
      ${tip("🔥","Horno",hor,1)}
    </ul>`;

  const bars=[...body.querySelectorAll(".chart i")];
  const show=i=>{
    bars.forEach((b,k)=>b.classList.toggle("sel",k===i));
    document.getElementById("r-h").textContent = (esHoy&&i===hAhora?"Ahora · ":"")+`${hh(i)}–${hh(i+1)}`;
    document.getElementById("r-p").innerHTML=`${eur(p[i])}<small>€/kWh</small>`;
    const c=document.getElementById("r-c"); c.className="chip "+nivel(p[i]); c.textContent=NIVEL_TXT[nivel(p[i])];
  };
  show(inicial);
  const chart=document.getElementById("chart");
  const idx=e=>{const r=chart.getBoundingClientRect();return Math.max(0,Math.min(23,Math.floor((e.clientX-r.left)/r.width*24)));};
  chart.addEventListener("pointermove",e=>show(idx(e)));
  chart.addEventListener("pointerdown",e=>show(idx(e)));
  chart.addEventListener("pointerleave",()=>show(inicial));
}
document.getElementById("b-hoy").addEventListener("click",()=>{LUZ.vista="hoy";renderLuz();});
document.getElementById("b-man").addEventListener("click",()=>{LUZ.vista="man";renderLuz();});

function tick(){ document.getElementById("hora").textContent=new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}); }
tick(); render();
setInterval(tick,15000);
setInterval(render,10*60*1000);
</script>

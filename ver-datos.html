<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ver datos de Turnos</title>
<style>
body{font:15px -apple-system,system-ui,sans-serif;margin:0;padding:20px;background:#f2f2f7;color:#000}
h1{font-size:22px;margin:0 0 12px}
button{font:inherit;font-weight:600;background:#007aff;color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
#msg{margin:10px 0;color:#3c3c4399}
textarea{width:100%;height:60vh;box-sizing:border-box;font:12px ui-monospace,Menlo,monospace;border-radius:10px;border:1px solid #ccc;padding:10px}
</style>
</head>
<body>
<h1>Datos de ejemplo de Turnos (solo lectura)</h1>
<button id="copiar">Copiar</button>
<p id="msg">Cargando…</p>
<textarea id="out" readonly></textarea>
<script>
(async()=>{
  const K="AIzaSyDHC981ppY60vOx5fimVAk-0L8XzTnUun8", B="https://firestore.googleapis.com/v1/projects/turnos-web-mediterraneo/databases/(default)/documents";
  try{
    const t=await (await fetch(`${B}/turnos/data?key=${K}&mask.fieldPaths=events`)).json();
    const ev=t.fields.events.arrayValue.values;
    const fede=ev.filter(e=>JSON.stringify(e).includes("Fede"));
    const o=await (await fetch(`${B}/dashboard-overrides?pageSize=2&key=${K}`)).json();
    document.getElementById("out").value=JSON.stringify({total:ev.length, ejemploCualquiera:ev.slice(-3), ejemplosFede:fede.slice(-6), overrides:o.documents?.slice(0,2)??"vacío"},null,1);
    document.getElementById("msg").textContent="Listo. Pulsa Copiar y pégalo en el chat.";
  }catch(e){ document.getElementById("msg").textContent="Error: "+e; }
})();
document.getElementById("copiar").onclick=async()=>{
  const ta=document.getElementById("out");
  try{ await navigator.clipboard.writeText(ta.value); }catch(e){ ta.select(); document.execCommand("copy"); }
  document.getElementById("msg").textContent="✅ Copiado. Pégalo en el chat.";
};
</script>
</body>
</html>
